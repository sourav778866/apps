<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Code</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial;
      background: #f5f5f5;
    }

    .box {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      padding: 10px;
      font-size: 16px;
      margin: 10px 0;
      width: 200px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
    }

    p {
      color: red;
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Enter Secret Code 🔐</h2>
    <input type="password" id="code" placeholder="Enter code">
    <br>
    <button onclick="checkCode()">Submit</button>
    <p id="error">Wrong code 😢</p>
  </div>

  <script>
    function checkCode() {
      const entered = document.getElementById("code").value;

      if (entered === "9-11-21") { // 👉 change your secret code here
        window.location.href = "login.html";
      } else {
        document.getElementById("error").style.display = "block";
      }
    }
  </script>

</body>
</html>
