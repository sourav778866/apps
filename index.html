<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Code 🔐</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }

    .box {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    input {
      padding: 12px;
      font-size: 16px;
      margin: 10px 0;
      width: 220px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }

    p {
      color: red;
      display: none;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Enter Secret Code 🔐</h2>
    <input type="password" id="code" placeholder="Enter code" autofocus>
    <br>
    <button onclick="checkCode()">Enter</button>
    <p id="error">Wrong code 😢</p>
  </div>

  <script>
    function checkCode() {
      const entered = document.getElementById("code").value;

      if (entered === "9-11-21") {
        window.location.href = "main.html";
      } else {
        document.getElementById("error").style.display = "block";
      }
    }

    // Enter key support
    document.getElementById("code").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        checkCode();
      }
    });
  </script>

</body>
</html>
