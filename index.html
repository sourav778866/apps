<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fun App</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      margin-top: 100px;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 10px;
      cursor: pointer;
      position: relative;
    }

    #noBtn {
      position: absolute;
    }

    #message {
      font-size: 24px;
      color: green;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <h2>Do you like me? 😏</h2>

  <button onclick="sayYes()">Yes ❤️</button>
  <button id="noBtn">No 😢</button>

  <div id="message">I knew it 😍❤️</div>

  <script>
    const noBtn = document.getElementById("noBtn");

    function moveButton() {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    // Move on hover
    noBtn.addEventListener("mouseover", moveButton);

    // Also move on click attempt
    noBtn.addEventListener("click", moveButton);

    function sayYes() {
      document.getElementById("message").style.display = "block";
    }
  </script>

</body>
</html>
