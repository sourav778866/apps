<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
.thank-you {
  display: none;
  margin-top: 20px;
  padding: 20px;
  border-radius: 15px;
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  color: #333;
  animation: popUp 0.6s ease;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.thank-you h2 {
  margin-bottom: 10px;
  color: #e91e63;
}

@keyframes popUp {
  from {
    transform: scale(0.7);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  text-align: center;
  overflow: hidden;
}

/* Floating hearts */
.heart {
  position: absolute;
  color: rgba(255,255,255,0.6);
  font-size: 20px;
  animation: float 6s linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  max-width: 350px;
  margin: 80px auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

img {
  width: 130px;
}

button {
  padding: 12px 20px;
  margin: 10px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
}

#yesBtn {
  background: #4CAF50;
  color: white;
}

#noBtn {
  background: #f44336;
  color: white;
  position: absolute;
}

.btn-container {
  position: relative;
  height: 200px;
}

#message {
  display: none;
  font-size: 20px;
  color: #e91e63;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="card">

<img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">

<h3 id="typing"></h3>

<div class="btn-container">
  <button id="yesBtn" onclick="sayYes()">Yes ❤️</button>
  <button id="noBtn">No 😢</button>
</div>

<div id="message" class="thank-you">
  <h2>🥺❤️ Thank You So Much Catto...</h2>
  <p>You just made my heart so happy 💖</p>
  <p>I promise I’ll do better and never hurt you again 🌸</p>
  <p>You really mean a lot to me... more than I can explain 💫</p>
</div>

<script>
// Floating hearts
for (let i = 0; i < 15; i++) {
  let heart = document.createElement("div");
  heart.innerHTML = "❤️";
  heart.className = "heart";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 10) + "px";
  heart.style.animationDuration = (Math.random() * 5 + 3) + "s";
  document.body.appendChild(heart);
}

// Typing effect
const text = "I know I messed up... I'm really sorry 😔 Will you forgive me?";
let i = 0;
function typing() {
  if (i < text.length) {
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typing, 40);
  }
}
typing();

// Moving NO button
const noBtn = document.getElementById("noBtn");

function moveButton() {
  const container = document.querySelector(".btn-container");

  const x = Math.random() * (container.clientWidth - noBtn.offsetWidth);
  const y = Math.random() * (container.clientHeight - noBtn.offsetHeight);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

noBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  moveButton();
});

noBtn.addEventListener("mouseover", moveButton);
function sayYes() {
  const msg = document.getElementById("message");
  msg.style.display = "block";

  // Heart burst effect 💖
  for (let i = 0; i < 25; i++) {
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.style.position = "fixed";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = "100vh";
    heart.style.fontSize = "20px";
    heart.style.animation = "float 3s linear";
    document.body.appendChild(heart);
  }
}
</script>

</body>
</html>
