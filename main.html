<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    text-align: center;
    color: #333;
  }

  .container {
    padding: 20px;
  }

  .card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    max-width: 350px;
    margin: auto;
    margin-top: 60px;
  }

  img {
    width: 130px;
    margin: 10px 0;
  }

  h3 {
    margin: 10px 0;
  }

  button {
    padding: 12px 20px;
    margin: 10px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }

  #yesBtn {
    background: #4CAF50;
    color: white;
  }

  #noBtn {
    background: #f44336;
    color: white;
    position: absolute;
  }

  .btn-container {
    position: relative;
    height: 200px;
    margin-top: 10px;
  }

  #message {
    font-size: 20px;
    color: #e91e63;
    display: none;
    margin-top: 15px;
  }
</style>
</head>

<body>

<div class="container">
  <div class="card">
    
    <!-- Cute GIF -->
    <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">

    <h3>I know I messed up... 😔</h3>
    <p>Will you accept my apology?</p>

    <div class="btn-container">
      <button id="yesBtn" onclick="sayYes()">Yes ❤️</button>
      <button id="noBtn">No 😢</button>
    </div>

    <div id="message">Thank you so much Catto 🥺❤️ You made my day!</div>

  </div>
</div>

<script>
  const noBtn = document.getElementById("noBtn");

  function moveButton() {
    const container = document.querySelector(".btn-container");

    const maxX = container.clientWidth - noBtn.offsetWidth;
    const maxY = container.clientHeight - noBtn.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  // Mobile support
  noBtn.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveButton();
  });

  // Desktop fallback
  noBtn.addEventListener("mouseover", moveButton);

  function sayYes() {
    document.getElementById("message").style.display = "block";
  }
</script>

</body>
</html>
